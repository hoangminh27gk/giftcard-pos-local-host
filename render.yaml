services:
  - type: web
    name: giftcard-pos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: giftcard-db
          property: connectionString
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false          # you will be asked to type this in the Render dashboard (e.g. password123!)
      - key: SECRET_KEY
        generateValue: true
      - key: BUSINESS_NAME
        value: Giftcard POS
      - key: BUSINESS_ADDRESS
        value: ""
      - key: BUSINESS_PHONE
        value: ""

databases:
  - name: giftcard-db
    plan: free
