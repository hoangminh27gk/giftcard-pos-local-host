<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Giftcard POS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .login-box {
    background: #fff; border-radius: 16px; padding: 36px 32px;
    width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  h1 { font-size: 18px; color: #111827; margin: 14px 0 4px; letter-spacing: 1px; }
  .sub { font-size: 12px; color: #9ca3af; letter-spacing: 2px; margin-bottom: 26px; }
  label { display: block; text-align: left; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 16px; outline: none; margin-bottom: 16px;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 8px;
    background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4338ca; }
  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: left;
  }
</style>
</head>
<body>
  <div class="login-box">
    <svg width="72" height="34" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f5e070"/><stop offset="40%" stop-color="#c9960c"/>
          <stop offset="70%" stop-color="#e8b923"/><stop offset="100%" stop-color="#a07208"/>
        </linearGradient>
      </defs>
      <rect width="680" height="320" fill="#1a1208" rx="24"/>
      <text x="340" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="80" font-weight="700" letter-spacing="18" fill="url(#gold)">GC</text>
      <text x="340" y="235" text-anchor="middle" font-family="Georgia,serif" font-size="34" letter-spacing="14" fill="#ffffff">POS</text>
    </svg>
    <h1>GIFTCARD POS</h1>
    <div class="sub">STAFF LOGIN</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" autocomplete="username" autofocus required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
